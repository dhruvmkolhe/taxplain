    <!-- Inject GA Measurement ID from build-time env so the consent-gated loader can use it.
         TODO: Set VITE_GA_MEASUREMENT_ID=G-XXXXXXXXXX in your .env file with your real GA4 ID. -->
    <script>window.__GA_MEASUREMENT_ID__ = '%VITE_GA_MEASUREMENT_ID%';</script>

    <script>
      // Consent-gated Google Analytics 4 loader
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;

      (function() {
        try {
          var consent = localStorage.getItem('taxplain_cookie_consent');
          var gaId = window.__GA_MEASUREMENT_ID__;
          if (consent === 'accepted' && gaId && gaId !== 'G-XXXXXXXXXX' && gaId !== '%VITE_GA_MEASUREMENT_ID%') {
            var gaScript = document.createElement('script');
            gaScript.async = true;
            gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(gaId);
            document.head.appendChild(gaScript);
            gtag('js', new Date());
            gtag('config', gaId, { anonymize_ip: true });
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-[#111111] font-sans antialiased selection:bg-gray-200 selection:text-black">
